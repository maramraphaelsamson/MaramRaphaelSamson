<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Momento event photo discovery preview</title><desc id="desc">Illustrated event gallery and selfie match card for finding a guest’s photos.</desc><defs><linearGradient id="lav" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a695c5"/><stop offset="1" stop-color="#706eaa"/></linearGradient><linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edb48f"/><stop offset="1" stop-color="#9c5e54"/></linearGradient></defs><rect width="1200" height="720" fill="#fbf9f6"/><path d="M0 91h1200" stroke="#eee9e2" stroke-width="2"/><text x="54" y="58" font-family="Georgia,serif" font-size="42" font-style="italic" fill="#15182a">Momento</text><g font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#485267"><text x="360" y="54">Home</text><text x="428" y="54">How It Works</text><text x="550" y="54">Features</text><text x="653" y="54">For Photographers</text><text x="816" y="54">Pricing</text><text x="900" y="54">Contact</text></g><rect x="1052" y="22" width="110" height="48" rx="23" fill="#b9824d"/><text x="1077" y="52" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Get started</text><text x="55" y="191" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#b9824d">EVENT PHOTOS, MADE EASY</text><text x="55" y="272" font-family="Georgia,serif" font-size="67" fill="#090e23">Find every</text><text x="55" y="347" font-family="Georgia,serif" font-size="67" fill="#090e23">moment <tspan fill="#b9824d" font-style="italic">you’re in.</tspan></text><text x="57" y="411" font-family="Arial,sans-serif" font-size="22" fill="#52617a">Photographers upload. Guests find themselves.</text><text x="57" y="445" font-family="Arial,sans-serif" font-size="22" fill="#52617a">AI helps you discover every photo from an event.</text><rect x="56" y="487" width="190" height="58" rx="29" fill="#05091d