<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Voxora voice studio preview</title><desc id="desc">Illustrated audio creation studio with speakers, dialogue, waveform and export control.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1930"/><stop offset="1" stop-color="#10121d"/></linearGradient><linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9f79ff"/><stop offset="1" stop-color="#40d8ce"/></linearGradient></defs><rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="76" fill="#151522"/><path d="M0 76h1200" stroke="#302d43"/><circle cx="54" cy="38" r="20" fill="#7f61df"/><path d="M47 29v18l15-9z" fill="#fff"/><text x="85" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#f8f7ff">VOXORA</text><text x="252" y="46" font-family="Arial,sans-serif" font-size="14" fill="#9b9bb1">VOICE STUDIO</text><rect x="1014" y="17" width="142" height="42" rx="12" fill="#26243a"/><circle cx="1037" cy="38" r="6" fill="#45d6af"/><text x="1052" y="44" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#e3e1ef">Saved locally</text><text x="50" y="138" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#a99cf2">MULTI-SPEAKER AUDIO</text><text x="50" y="198" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#f8f7ff">A voice for every line.</text><text x="52" y="232" font-family="Arial,sans-serif" font-size="16" fill="#a5a5b7">Shape dialogue into expressive, ready-to-export audio.</text><rect x="50" y="276" width="702" height="326" rx="22" fill="#1b1b2b" stroke="#343249"/><text x="81" y="319" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#dfdced">SCRIPT</text><rect x="81" y="342" width="640" height="69" rx="14" fill="#242337"/><circle cx="111" cy="376" r="18" fill="#7f61df"/><text x="105" y="382" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#fff">S</text><text x="143" y="369" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#bcb2f5">SARAH · FRENCH</text><text x="143" y="392" font-family="Arial,sans-serif" font-size="14" fill="#e0deea">The best stories make you want to listen.</text><rect x="81" y="424" width="640" height="69" rx="14" fill="#242337"/><circle cx="111" cy="458" r="18" fill="#31afa8"/><text x="105" y="464" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#fff">J</text><text x="143" y="451" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#72ded3">JAMES · BRITISH</text><text x="143" y="474" font-family="Arial,sans-serif" font-size="14" fill="#e0deea">Then let’s give every voice its own sound.</text><rect x="81" y="520" width="640" height="51" rx="14" fill="#242337"/><text x="103" y="552" font-family="Arial,sans-serif" font-size="14" fill="#9c9bae">＋ Add another speaker or dialogue line</text><rect x="782" y="276" width="368" height="326" rx="22" fill="#1b1b2b" stroke="#343249"/><text x="812" y="319" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#dfdced">VOICE PREVIEW</text><circle cx="966" cy="399" r="58" fill="#2d2946"/><circle cx="966" cy="399" r="43" fill="#7f61df"/><path d="M954 380v38l31-19z" fill="#fff"/><text x="896" y="487" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4f2fb">Sarah · Neural voice</text><text x="905" y="512" font-family="Arial,sans-serif" font-size="13" fill="#9d9caf">French accent · 1.0× speed</text><rect x="812" y="539" width="308" height="43" rx="12" fill="#7f61df"/><text x="900" y="567" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">Generate audio</text><rect x="50" y="627" width="1100" height="55" rx="15" fill="#1b1b2b" stroke="#343249"/><text x="77" y="661" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#c7c4d6">WAVEFORM</text><g stroke="url(#wave)" stroke-width="6" stroke-linecap="round"><path d="M220 655v-8m18 18v-29m18 23v-13m18 11v-34m18 28v-18m18 23v-10m18 14v-25m18 16v-8m18 20v-34m18 25v-15m18 19v-12m18 9v-29m18 18v-7m18 15v-22m18 18v-14m18 19v-31m18 25v-19m18 25v-11m18 13v-24m18 20v-16m18 21v-32m18 27v-19m18 13v-6m18 12v-25m18 17v-8m18 16v-28m18 19v-11m18 19v-20m18 13v-8m18 14v-25m18 17v-10m18 15v-19m18 13v-7m18 19v-29m18 20v-12m18 16v-21m18 11v-4"/></g></svg>
